<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第二版 · 全 60 词 — Line Edition 单词卡</title>
<style>
  :root { --paper:#f5f4f0; --ink:#22201c; --red:#ae6557; --gray:#8a8880; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Noto Serif SC", Georgia, serif; }
  header { max-width:760px; margin:0 auto; padding:34px 20px 6px; text-align:center; }
  .kicker { font-family:ui-monospace, Menlo, monospace; font-size:11px; letter-spacing:.32em; color:var(--red); }
  h1 { font-size:34px; font-weight:900; margin:10px 0 4px; }
  .sub { color:var(--gray); font-size:14px; }
  main { max-width:520px; margin:0 auto; padding:18px 16px 10px; }
  #card { width:100%; border-radius:6px; box-shadow:0 10px 34px rgba(30,25,18,.16); display:block; background:#fff; }
  .nav { display:flex; align-items:center; justify-content:space-between; margin:16px 2px 6px; }
  button { font-family:inherit; font-size:15px; padding:9px 20px; border:1px solid #c9c6bd; background:#fff; border-radius:999px; cursor:pointer; }
  button:hover { border-color:var(--red); color:var(--red); }
  #counter { font-family:ui-monospace, Menlo, monospace; font-size:13px; color:var(--gray); letter-spacing:.14em; }
  #wordname { text-align:center; font-size:17px; margin:2px 0 10px; color:var(--ink); }
  .thumbs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:760px; margin:14px auto 30px; padding:0 16px; }
  .thumbs img { width:64px; border-radius:4px; cursor:pointer; opacity:.55; border:2px solid transparent; }
  .thumbs img.on { opacity:1; border-color:var(--red); }
  footer { text-align:center; color:var(--gray); font-size:13px; padding:0 20px 44px; line-height:1.9; }
</style>
</head>
<body>
<header>
  <div class="kicker">LINE EDITION · L1 · 01–60</div>
  <h1>第二版 · 全部六十词</h1>
  <div class="sub">杂志线条版单词卡 — 同一组词，另一种打开方式</div>
</header>
<main>
  <img id="card" src="cards/01-procrastinate.webp" alt="vocab card">
  <div class="nav">
    <button id="prev">← 上一张</button>
    <span id="counter">1 / 60</span>
    <button id="next">下一张 →</button>
  </div>
  <div id="wordname">procrastinate</div>
</main>
<div class="thumbs" id="thumbs"></div>
<footer>
  每个词共 3 套梗图，可随时更换 — 其余两套陆续补齐。<br>
  第一版水彩卡在 <a href="/vocab/" style="color:#ae6557">/vocab/</a>
</footer>
<script>
  const words = ["procrastinate","serendipity","ephemeral","dilemma","chaos","irony","myth","genius","disaster","legend","victory","mystery","trap","rumor","treasure","enemy","excuse","feast","marathon","phenomenon","exaggerate","hesitate","celebrate","multitask","cram","snooze","eavesdrop","doodle","binge","vanish","stumble","brag","panic","resist","jinx","daydream","fumble","chaotic","hilarious","awkward","suspicious","dramatic","epic","brutal","savage","clueless","exhausted","starving","obsessed","flawless","doomed","iconic","relatable","paradox","nemesis","plummet","thrive","vivid","relentless","bittersweet"];
  const files = words.map((w,i)=> "cards/" + String(i+1).padStart(2,"0") + "-" + w + ".webp");
  let i = 0;
  const img = document.getElementById("card"), counter = document.getElementById("counter"), name = document.getElementById("wordname");
  const thumbs = document.getElementById("thumbs");
  files.forEach((f,j)=>{ const t = document.createElement("img"); t.src=f; t.alt=words[j]; t.onclick=()=>show(j); thumbs.appendChild(t); });
  function show(j){
    i = (j + files.length) % files.length;
    img.src = files[i]; counter.textContent = (i+1) + " / " + files.length; name.textContent = words[i];
    [...thumbs.children].forEach((t,k)=> t.classList.toggle("on", k===i));
  }
  document.getElementById("prev").onclick = ()=>show(i-1);
  document.getElementById("next").onclick = ()=>show(i+1);
  document.addEventListener("keydown", e=>{ if(e.key==="ArrowLeft") show(i-1); if(e.key==="ArrowRight") show(i+1); });
  show(0);
</script>
</body>
</html>
