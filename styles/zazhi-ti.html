<style>
  .hermes-head, .nav-strip { background: #f5f4f0; }
:root {
color-scheme: light only;
--paper:#f5f4f0;
--ink:#110f12;
--bar:#1a1915;
--gray:#82817f;
--sub:#696864;
--accent:#ae6557;
--hair:#d6d5d1;
--tag-line:#d6d5d1;
--tag-text:#82817f;
--source:#e6e5e0;
--source-line:#8a8987;
--slot-line:#9b9993;
}
*{box-sizing:border-box}
html,body{margin:0;min-width:320px;background:var(--paper)!important;color:var(--ink);color-scheme:light only!important}
body{font-family:"Noto Sans SC","PingFang SC",sans-serif;-webkit-text-size-adjust:100%;font-size:16px;line-height:1.85}
.sheet{width:100%;padding:20px 70px 86px;background:var(--paper)!important}
.topbar{height:34px;display:flex;align-items:flex-start;justify-content:space-between;color:var(--gray);font:500 9px/1.2 "IBM Plex Mono",monospace;letter-spacing:.2em;white-space:nowrap}
.topbar>div{display:flex;align-items:center;gap:14px}
.article-word{color:var(--accent)}
.dash{display:inline-block;width:21px;height:1px;background:var(--hair)}
.black-rule{height:1px;background:var(--bar);width:calc(100% + 140px);margin-left:-70px}
.meta{height:56px;display:flex;align-items:flex-start;gap:22px;padding-top:16px;border-bottom:1px solid var(--hair);color:var(--gray);font:500 9px/1.4 "IBM Plex Mono",monospace;letter-spacing:.2em}
.meta span+span:before{content:"·";padding-right:22px;color:var(--gray)}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px}
.tag{display:inline-flex;align-items:center;height:25px;padding:0 11px;border:1px solid var(--tag-line);background:var(--paper);color:var(--tag-text);font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.2em}
.headline{margin:110px 0 0 8.4%;max-width:1100px}
h1{margin:0;color:var(--ink);font-family:"Noto Serif SC",serif;font-size:clamp(38px,5vw,72px);font-weight:900;line-height:1.13;letter-spacing:-.045em;text-align:left;text-wrap:balance}
.dek{max-width:820px;margin:27px 0 0;color:var(--sub);font-size:16px;line-height:1.85}
.section-rule{height:1px;margin:78px 0 0;background:var(--hair)}
.source{max-width:850px;margin:44px auto 0;padding:17px 20px 18px;border-left:3px solid var(--source-line);background:var(--source);color:var(--sub);font-size:13px;line-height:1.75}
.hero{margin:56px 0 0;width:100%;height:min(50vw,660px);min-height:340px;display:grid;place-items:center;border:1px dashed var(--slot-line);overflow:hidden;background:var(--paper);color:var(--gray);font:500 12px/1.6 "IBM Plex Mono",monospace;letter-spacing:.13em;text-align:center}
.caption{display:flex;justify-content:space-between;gap:20px;padding:9px 0 0;color:var(--gray);font:500 9px/1.5 "IBM Plex Mono",monospace;letter-spacing:.13em}
.article-content{max-width:none;margin:88px -70px 0;position:relative}
.kicker{position:relative;margin:76px 14% 26px 10%!important;color:var(--gray)!important;font:500 9px/1.4 "IBM Plex Mono",monospace!important;letter-spacing:.2em}
.kicker:first-child{margin-top:0!important}
.chapter-no{position:absolute;left:-7.6vw;right:auto;color:var(--ink)}
.chapter-label:before{content:"— ";color:var(--gray)}
.article-content p{margin:0 14% 1.55em 10%;color:#333333;font-size:16px;line-height:2}
.article-content h2{margin:0 14% 26px 15%;color:var(--ink);font-family:"Noto Serif SC",serif;font-size:clamp(28px,3.2vw,42px);font-weight:900;line-height:1.28;letter-spacing:-.04em}
.article-content blockquote{margin:54px 11% 54px 10%;padding:28px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);color:var(--ink);font-family:"Noto Serif SC",serif;font-size:clamp(22px,2.5vw,31px);font-weight:700;line-height:1.65;letter-spacing:-.03em}
.inline-image{width:min(936px,calc(100% - 140px));margin:58px auto 66px;height:430px;display:grid;place-items:center;border:1px dashed var(--slot-line);background:var(--paper);color:var(--gray);font:500 12px/1.6 "IBM Plex Mono",monospace;letter-spacing:.13em;text-align:center;overflow:hidden}
.inline-caption{width:min(936px,calc(100% - 140px));margin:-55px auto 64px;color:var(--gray);font:500 9px/1.5 "IBM Plex Mono",monospace;letter-spacing:.13em}
.byline-end{margin-top:68px!important;text-align:right;color:var(--sub)!important;font-family:"Noto Serif SC",serif;font-weight:700}
.end-rule{width:min(780px,calc(100% - 140px));height:2px;margin:30px auto 0;background:var(--bar)}
.signoff{display:flex;justify-content:space-between;gap:20px;width:min(780px,calc(100% - 140px));margin:0 auto;padding-top:19px;color:var(--gray);font:500 9px/1.5 "IBM Plex Mono",monospace;letter-spacing:.2em}
.signoff strong{color:var(--ink);font-weight:500}
.slot{outline:1px dashed var(--slot-line);outline-offset:6px}
.tag.slot{border-color:var(--slot-line);border-style:dashed;outline:0}
.source.slot{outline-offset:5px}
.hero.slot,.inline-image.slot{outline:0}
@media(max-width:760px){
.sheet{padding:16px 22px 54px}
.topbar{height:30px}
.black-rule{width:calc(100% + 44px);margin-left:-22px}
.topbar>div{gap:8px}.dash{width:12px}.right span:first-child{display:none}
.meta{height:auto;min-height:56px;flex-wrap:wrap;gap:5px 12px;padding:14px 0}
.meta span+span:before{padding-right:12px}
.headline{margin:72px 0 0 0}
h1{font-size:clamp(38px,11vw,54px);line-height:1.16}
.dek{margin-top:22px;font-size:15px}
.section-rule{margin-top:52px}
.source{margin-top:32px;padding:15px 16px;font-size:12px}
.hero{margin:38px -22px 0;width:calc(100% + 44px);height:68vw;min-height:270px}
.caption{display:block}.caption span:last-child{display:block;margin-top:3px}
.article-content{margin:60px -22px 0}
.kicker,.article-content p{margin-left:22px!important;margin-right:22px!important}
.kicker{margin-bottom:26px!important}
.kicker:not(:first-child){margin-top:58px!important}
.chapter-no{left:-16px;right:auto}
.article-content h2{margin:0 22px 26px}
.article-content blockquote{margin:42px 22px;padding:24px 0}
.inline-image{width:100%;margin:42px 0 60px;height:68vw}
.inline-caption{width:auto;margin:-51px 22px 56px}
.end-rule,.signoff{width:calc(100% - 44px);margin-left:22px;margin-right:22px}
.signoff{flex-direction:column;gap:8px}
.slot{outline-offset:4px}
}
@media(max-width:420px){.right{display:none}.topbar{justify-content:flex-start}.meta{font-size:8px}.tag{font-size:8px}}
</style>

<script>
/* ================================================================
杂志体文章配置区
新文章只需修改下面这个 CONFIG 对象，不需要改动 HTML。
阅读时长保持“自动”，页面会根据正文自动估算“约 X 分钟”。
章节编号会按“章节”数组中的小标题顺序自动生成 01、02……
================================================================ */
const CONFIG = {
标题: "杂志体 MAGAZINE STYLE",
副标题: "对标 @op7418 的长文排版规范 —— 暖纸底、唯一赭红点缀的黑白杂志风。以后做网页，说“用杂志体”，即按这一页出。",
标签: ["杂志体", "MAGAZINE", "STYLE LIBRARY"],
来源: "来源：对标 @op7418 文章排版 100% 复原；全部色值 2026-10-14 从原版截图逐像素实测。规范文件：workspace/your_files/web-styles/magazine-bw-style-guide.md。调用语：“用黑白杂志风” 或 “按 demo 那套风格”。",
日期: "2026.10.14",
作者: "卷帘人 整理",
阅读时长: "自动",
首图说明: "本页即按杂志体渲染的活例子",
章节: [
{
小标题: "一、名字",
正文: ["杂志体 · MAGAZINE STYLE。2026-10-14 定稿，Joyce 亲定为网页默认风格之一。"],
引用: "",
配图说明: ""
},
{
小标题: "二、一句话定位",
正文: ["黑白杂志风的长文排版：暖纸底色、唯一赭红点缀，大标题配小字顶栏，克制、留白、有呼吸感。"],
引用: "",
配图说明: ""
},
{
小标题: "三、要求",
正文: [
"色彩（实测值，不许改）：页面背景 #f5f4f0 暖纸色（不是纯白）；大标题 #110f12；副标题 #696864；顶栏/元信息小字 #82817f；顶栏 ARTICLE 点缀 #ae6557（全页唯一的彩色）；顶部黑线 #1a1915 2px；标签描边 #d6d5d1；来源框背景 #e6e5e0，左竖线 #8a8987。",
"字体：大标题 Noto Serif SC 900，clamp(38px, 5vw, 72px)，字距 -0.045em，左对齐；正文 Noto Sans SC；顶栏/元信息/标签等宽 mono 9px，字距 0.2em，大写。",
"版式：顶栏左 ARTICLE — FINAL（ARTICLE 赭红），右“卷帘人 PAGE — 日期”；下方 2px 黑线通栏；元信息行灰色 mono 小字；标签为方形描边 pill；大标题左对齐 + 灰色副标题 + 浅灰分隔线 + 灰底来源框（左竖线）+ 通栏首图；首屏页边距 70px；正文栏左 10%、右 13–15%；引用块左 10%、右 11%；小节标题左缩进 15%。",
"不要做的：无右侧边栏、无多余装饰线、无彩色点缀（赭红除外）；正文插图与封面区分色系；移动端保持同一视觉语言，自然重排。"
],
引用: "教训：背景不是纯白——第一版凭观感写了 #ffffff，被 Joyce 两次纠正，实测是暖纸色 #f5f4f0。以后所有色值以实测为准。",
配图说明: ""
},
{
小标题: "四、例子",
正文: ["本页即按杂志体渲染的活例子。另有单文件样张模板 magazine-bw-sample.html（不依赖网络，打开即看）。"],
引用: "",
配图说明: ""
}
]
};

(function renderTemplate() {
const $ = (selector) => document.querySelector(selector);
const isPlaceholder = (value) => typeof value === "string" && /\u3010[^\u3011]*槽[^\u3011]*\u3011/.test(value);
const setText = (selector, value, slotAware) => {
const element = $(selector);
element.textContent = value;
if (slotAware && isPlaceholder(value)) element.classList.add("slot");
};

document.title = isPlaceholder(CONFIG.标题)? "杂志体文章模板 · 卷帘人": CONFIG.标题 + " · 卷帘人";
setText("#articleTitle", CONFIG.标题, true);
setText("#articleSubtitle", CONFIG.副标题, true);
setText("#articleSource", CONFIG.来源, true);
setText("#heroCaption", CONFIG.首图说明, true);
setText("#topDate", CONFIG.日期, true);
setText("#metaAuthor", "作者 " + CONFIG.作者, true);
setText("#metaDate", "日期 " + CONFIG.日期, true);

const tags = $("#tags");
CONFIG.标签.forEach((label) => {
const tag = document.createElement("span");
tag.className = "tag" + (isPlaceholder(label)? " slot": "");
tag.textContent = label;
tags.appendChild(tag);
});

const content = $("#articleContent");
CONFIG.章节.forEach((section) => {
const heading = document.createElement("h2");
heading.textContent = section.小标题;
heading.dataset.sectionTitle = "";
if (isPlaceholder(section.小标题)) heading.classList.add("slot");
content.appendChild(heading);

(section.正文 || []).forEach((text) => {
const paragraph = document.createElement("p");
paragraph.className = "body-copy" + (isPlaceholder(text)? " slot": "");
paragraph.textContent = text;
content.appendChild(paragraph);
});

if (section.引用) {
const quote = document.createElement("blockquote");
quote.className = isPlaceholder(section.引用)? "slot": "";
quote.textContent = section.引用;
content.appendChild(quote);
}

if (section.配图说明) {
const figure = document.createElement("figure");
figure.className = "inline-image slot";
figure.setAttribute("role", "img");
figure.setAttribute("aria-label", "正文配图占位");
figure.textContent = "正文配图位（可选）";
content.appendChild(figure);

const caption = document.createElement("div");
caption.className = "inline-caption" + (isPlaceholder(section.配图说明)? " slot": "");
caption.textContent = section.配图说明;
content.appendChild(caption);
}
});

content.querySelectorAll("h2[data-section-title]").forEach((heading, index) => {
const kicker = document.createElement("p");
kicker.className = "kicker";
kicker.innerHTML = '<span class="chapter-no">' + String(index + 1).padStart(2, "0") + '</span><span class="chapter-label">章节</span>';
content.insertBefore(kicker, heading);
});

const byline = document.createElement("p");
byline.className = "byline-end" + (isPlaceholder(CONFIG.作者) ? " slot" : "");
byline.textContent = "—— " + CONFIG.作者;
content.appendChild(byline);

const endRule = document.createElement("div");
endRule.className = "end-rule";
endRule.setAttribute("aria-hidden", "true");
content.appendChild(endRule);

const footer = document.createElement("footer");
footer.className = "signoff";
footer.innerHTML = "<span><strong>卷帘人</strong> — 杂志体</span><span>完 / " + CONFIG.日期 + "</span>";
content.appendChild(footer);

function estimateReadingTime() {
const rawText = Array.from(content.querySelectorAll(".body-copy, blockquote"))
.map((node) => node.textContent)
.join(" ")
.replace(/\u3010[^\u3011]*\u3011/g, "");
const cjkCount = (rawText.match(/[\u3400-\u9fff\uf900-\ufaff]/g) || []).length;
const latinWordCount = (rawText.replace(/[\u3400-\u9fff\uf900-\ufaff]/g, " ").match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g) || []).length;
return Math.max(1, Math.ceil(cjkCount / 500 + latinWordCount / 200));
}

const estimatedMinutes = estimateReadingTime();
const configuredReading = String(CONFIG.阅读时长 || "自动").trim();
const readingLabel = configuredReading === "自动"
? "约 " + estimatedMinutes + " 分钟"
: (/^\d+$/.test(configuredReading) ? "约 " + configuredReading + " 分钟" : configuredReading);
$("#metaReading").textContent = "阅读 " + readingLabel;
})();
</script>

</script>
</body>
