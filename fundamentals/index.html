<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基本功字卡 — 卷帘人 CurtainRaiser</title>
<link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
  .card { perspective: 800px; cursor: pointer; height: 190px; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .5s; transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px 22px; display: flex; flex-direction: column; justify-content: center;
  }
  .face.back { transform: rotateY(180deg); background: #FFFDF8; }
  .face .tag {
    font-size: 12px; letter-spacing: 2px; color: var(--gold); margin-bottom: 8px;
  }
  .face .term { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  .face .en { font-size: 13px; color: var(--ink-soft); margin-top: 4px; font-style: italic; }
  .face.back .explain { font-size: 15px; margin-bottom: 8px; }
  .face.back .example {
    font-size: 13px; color: var(--ink-soft); background: var(--paper);
    border-radius: 6px; padding: 8px 10px; line-height: 1.7;
  }
  .face.back .example code { font-family: monospace; color: var(--ink); }
  .day-head {
    grid-column: 1 / -1; margin: 26px 0 2px; font-size: 14px;
    letter-spacing: 3px; color: var(--gold);
  }
  .day-head:first-of-type { margin-top: 6px; }
  .hint { text-align: center; color: var(--ink-soft); font-size: 13px; margin: 8px 0 20px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="site-head">
    <div class="brand-cn">卷帘人</div>
    <div class="brand-en">CurtainRaiser</div>
    <hr class="gold-rule">
  </header>

  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="../index.html">卷帘人<span class="en">CurtainRaiser</span></a>
      <button class="nav-toggle" aria-label="菜单"><span></span><span></span></button>
      <div class="nav-links">
      <a href="../index.html">首页</a>
      <a href="../roadmap/index.html">六个月</a>
      <a href="../library/index.html">资料库</a>
      <a href="../log/index.html">笔记本</a>
      <a href="../fundamentals/index.html" class="active">字卡</a>
      </div>
    </div>
  </nav>

  <section class="section">
    <h2>基本功字卡</h2>
    <div class="sub en">FLASHCARDS</div>
    <p class="hint">点卡片翻面 · 每天 7 张，60 天一轮</p>
    <p class="hint" id="filter-note" style="display:none"></p>
    <div class="cards" id="cards"></div>
  </section>

  <footer>
    <p>卷帘人 CurtainRaiser 📜</p>
    <p class="en">Go Big, Then Never Stop Running.</p>
  </footer>

</div>
<script>
fetch('cards.json').then(r => r.json()).then(cards => {
  const box = document.getElementById('cards');
  const note = document.getElementById('filter-note');
  let topic = '';
  try { topic = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (topic) {
    const hit = cards.filter(c => c.topic === topic);
    if (hit.length) {
      cards = hit;
      note.style.display = '';
      note.innerHTML = '只看【' + topic + '】 · <a href="#" id="show-all" style="color:var(--gold)">显示全部</a>';
    }
  }
  const days = [...new Set(cards.map(c => c.day))].sort((a, b) => b - a);
  days.forEach(d => {
    const h = document.createElement('div');
    h.className = 'day-head';
    h.textContent = d === 0 ? '✦ 开学前夜 · 第一批' : 'DAY ' + d;
    box.appendChild(h);
    cards.filter(c => c.day === d).forEach(c => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<div class="card-inner">' +
          '<div class="face"><div class="tag">' + c.topic + '</div>' +
          '<div class="term">' + c.term + '</div>' +
          (c.en ? '<div class="en">' + c.en + '</div>' : '') + '</div>' +
          '<div class="face back"><div class="explain">' + c.explain + '</div>' +
          (c.example ? '<div class="example">例：<code>' + c.example + '</code></div>' : '') + '</div>' +
        '</div>';
      el.addEventListener('click', () => el.classList.toggle('flipped'));
      box.appendChild(el);
    });
  });
  const sa = document.getElementById('show-all');
  if (sa) sa.addEventListener('click', e => {
    e.preventDefault();
    history.replaceState(null, '', location.pathname);
    location.reload();
  });
});
</script>
<script>
var _nt=document.querySelector(".nav-toggle"),_nl=document.querySelector(".nav-links");
if(_nt&&_nl){_nt.addEventListener("click",function(){_nl.classList.toggle("open");});}
</script>
</body>
</html>
